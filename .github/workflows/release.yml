# Builds the one-click Work Zone app from this source, in the cloud, for Windows, Mac and Linux.
# Each build first runs every test, then packs the app, then runs the packed app's own self-check
# (all example labels valid, a plug signed + verified, a changed byte refused, the dashboard served).
# Only if all of that passes on all three systems is a release published, with SHA-256 fingerprints.
# Start it by pushing a version tag (v1.16.0), or from the Actions tab ("Run workflow") for a test build.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            file: WorkZone-Windows.exe
          - os: macos-latest
            file: WorkZone-macOS
          - os: ubuntu-latest
            file: WorkZone-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Every test must pass first
        shell: bash
        run: |
          python -m unittest discover -s tests
          node --test --test-concurrency=1 tests/js/*.test.mjs

      - name: Pack the app (Python is inside; nothing to install)
        shell: bash
        run: |
          python -m pip install "pyinstaller==6.11.1"
          python -m PyInstaller --onefile --console --name WorkZone --paths tools \
            --hidden-import devices --hidden-import registry --hidden-import mcp_bridge \
            --add-data "ui:ui" --add-data "socket:socket" --add-data "examples:examples" \
            --add-data "devices:devices" --add-data "VERSION:." \
            tools/launch.py

      - name: The packed app checks itself
        shell: bash
        run: |
          app=dist/WorkZone; [ -f dist/WorkZone.exe ] && app=dist/WorkZone.exe
          WORKZONE_HOME="$RUNNER_TEMP/wzhome" "$app" --check
          mkdir out && cp "$app" "out/${{ matrix.file }}"
          cd out && python -c "import hashlib,sys; f=sys.argv[1]; print(hashlib.sha256(open(f,'rb').read()).hexdigest()+'  '+f)" "${{ matrix.file }}" > "${{ matrix.file }}.sha256"
          cat "${{ matrix.file }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat files/*.sha256 > files/SHA256SUMS.txt
          cat > notes.md <<'EOF'
          **Download one file, double-click it, and Work Zone opens in your browser.** Nothing else to install.

          | Your computer | Download |
          |---|---|
          | Windows | `WorkZone-Windows.exe` |
          | Mac | `WorkZone-macOS` |
          | Linux | `WorkZone-Linux` |

          Keep the small window that opens: Work Zone runs while it's open, and strict mode asks you to type `yes` there before anything risky happens.

          **First time on Windows:** it may say "Windows protected your PC", because the app is new and not paid-signed. Click **More info → Run anyway**.
          **First time on Mac:** right-click the file → **Open** → **Open**. In Terminal you may first need `chmod +x WorkZone-macOS`.
          **Linux:** `chmod +x WorkZone-Linux` then run it.

          Built from this exact source by GitHub, after every test passed on all three systems. Check your download against `SHA256SUMS.txt`.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" files/WorkZone-Windows.exe files/WorkZone-macOS files/WorkZone-Linux files/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Work Zone $GITHUB_REF_NAME" --notes-file notes.md
