<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1726;color:#e6f3ff;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7dd3fc;margin:0 0 12px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(40,74,112,.55);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#7dd3fc}button.on,button.primary{background:#7dd3fc;color:#06121f;border-color:#7dd3fc}
input,select,textarea{background:rgba(8,20,36,.72);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:7px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#7dd3fc}
.card{background:rgba(22,44,72,.55);border:1px solid rgba(125,211,252,.22);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:#8fb3cf}.ok{color:#86efac}.bad{color:#fca5a5}
.note{margin-top:8px;font-size:12px;color:#8fb3cf}

.big{font:600 44px ui-monospace,Consolas,monospace}#week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:10px}.day{text-align:center;padding:8px 4px;font-size:12px}
@media (max-width:600px){#week{grid-template-columns:repeat(4,1fr)}}</style>

<div class="wrap"><h1>Weather</h1>
<div class="row"><input id="city" placeholder="City, e.g. London" style="flex:1" maxlength="80"><button type="button" id="go" class="primary">show</button></div>
<div id="now" class="card" style="margin-top:12px"><span class="mut">Type a city.</span></div><div id="week"></div>
<div class="note">Weather data by Open-Meteo.com (CC BY 4.0). Asked through the socket's gateway; nothing else can be reached.</div></div>
<script>
// A plug's only way out is the socket. Each request is checked against plug.json and logged.
function ask(msg) {
  return new Promise(function (resolve) {
    var id = Math.random().toString(36).slice(2);
    var timer = setTimeout(function () { removeEventListener('message', on); resolve({ ok: false, reason: 'no answer' }); }, 10000);
    function on(e) { if (e.data && e.data.topic === 'reply' && e.data.id === id) { clearTimeout(timer); removeEventListener('message', on); resolve(e.data); } }
    addEventListener('message', on);
    parent.postMessage(Object.assign({ id: id }, msg), '*');
  });
}
function load(key) { return ask({ topic: 'storage.get', key: key }).then(function (r) { return r.ok ? r.reply : undefined; }); }
function save(key, value) { return ask({ topic: 'storage.set', key: key, value: value }); }

var CODES = { 0: 'clear', 1: 'mostly clear', 2: 'partly cloudy', 3: 'cloudy', 45: 'fog', 48: 'fog', 51: 'drizzle', 53: 'drizzle', 55: 'drizzle', 61: 'rain', 63: 'rain', 65: 'heavy rain', 71: 'snow', 73: 'snow', 75: 'heavy snow', 80: 'showers', 81: 'showers', 82: 'heavy showers', 95: 'thunderstorm', 96: 'thunderstorm', 99: 'thunderstorm' };
function el(id) { return document.getElementById(id); }
function get(url) { return ask({ topic: 'net.fetch', url: url, method: 'GET' }).then(function (r) { if (!r.ok) throw new Error(r.reason || 'refused'); if (!r.reply || r.reply.status !== 200) throw new Error('the weather service did not answer'); return JSON.parse(r.reply.body); }); }
async function show(name) {
  el('now').textContent = 'Looking up ' + name + '...'; el('week').textContent = '';
  try {
    var geo = await get('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(name));
    if (!geo.results || !geo.results.length) { el('now').textContent = 'No place called "' + name + '" found.'; return; }
    var p = geo.results[0];
    var w = await get('https://api.open-meteo.com/v1/forecast?latitude=' + p.latitude + '&longitude=' + p.longitude + '&current=temperature_2m,apparent_temperature,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto');
    var c = w.current;
    el('now').innerHTML = '';
    var h = document.createElement('div'); h.className = 'big'; h.textContent = Math.round(c.temperature_2m) + ' C';
    var d = document.createElement('div'); d.textContent = p.name + (p.country ? ', ' + p.country : '') + ': ' + (CODES[c.weather_code] || 'weather') + ', feels ' + Math.round(c.apparent_temperature) + ' C, wind ' + Math.round(c.wind_speed_10m) + ' km/h';
    el('now').appendChild(h); el('now').appendChild(d);
    w.daily.time.forEach(function (t, i) {
      var b = document.createElement('div'); b.className = 'card day';
      var dn = new Date(t + 'T12:00').toLocaleDateString(undefined, { weekday: 'short' });
      b.innerHTML = '<b></b><div class="mut"></div><div></div>';
      b.children[0].textContent = dn; b.children[1].textContent = CODES[w.daily.weather_code[i]] || ''; b.children[2].textContent = Math.round(w.daily.temperature_2m_max[i]) + ' / ' + Math.round(w.daily.temperature_2m_min[i]);
      el('week').appendChild(b);
    });
    save('city', name);
  } catch (e) { el('now').textContent = 'Could not get the weather: ' + e.message + '. (Is the internet power switched on for this plug?)'; }
}
// (forms are blocked inside a plug's box, so a button and the Enter key do the job)
function go() { var v = el('city').value.trim(); if (v) show(v); }
el('go').onclick = go;
el('city').onkeydown = function (e) { if (e.key === 'Enter') go(); };
load('city').then(function (v) { if (typeof v === 'string' && v) { el('city').value = v; show(v); } });
parent.postMessage({ topic: 'plug.ready' }, '*');
</script>
