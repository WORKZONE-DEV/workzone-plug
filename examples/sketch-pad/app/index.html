<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch Pad</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1726;color:#e6f3ff;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7dd3fc;margin:0 0 12px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(40,74,112,.55);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#7dd3fc}button.on,button.primary{background:#7dd3fc;color:#06121f;border-color:#7dd3fc}
input,select,textarea{background:rgba(8,20,36,.72);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:7px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#7dd3fc}
.card{background:rgba(22,44,72,.55);border:1px solid rgba(125,211,252,.22);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:#8fb3cf}.ok{color:#86efac}.bad{color:#fca5a5}
.note{margin-top:8px;font-size:12px;color:#8fb3cf}

canvas{width:100%;border-radius:12px;border:1px solid rgba(125,211,252,.28);touch-action:none;cursor:crosshair;display:block}
.sw{width:24px;height:24px;padding:0;border-radius:50%}</style>

<div class="wrap" style="max-width:1000px"><h1>Sketch Pad</h1>
<div class="row" style="margin-bottom:8px"><span id="cols" class="row"></span><input id="size" type="range" min="1" max="40" value="4" title="brush size"><button id="erase">eraser</button><button id="undo">undo</button><button id="clear">clear</button><span id="s" class="mut"></span></div>
<canvas id="c" width="960" height="560"></canvas></div>
<script>
// A plug's only way out is the socket. Each request is checked against plug.json and logged.
function ask(msg) {
  return new Promise(function (resolve) {
    var id = Math.random().toString(36).slice(2);
    var timer = setTimeout(function () { removeEventListener('message', on); resolve({ ok: false, reason: 'no answer' }); }, 10000);
    function on(e) { if (e.data && e.data.topic === 'reply' && e.data.id === id) { clearTimeout(timer); removeEventListener('message', on); resolve(e.data); } }
    addEventListener('message', on);
    parent.postMessage(Object.assign({ id: id }, msg), '*');
  });
}
function load(key) { return ask({ topic: 'storage.get', key: key }).then(function (r) { return r.ok ? r.reply : undefined; }); }
function save(key, value) { return ask({ topic: 'storage.set', key: key, value: value }); }

var cv = document.getElementById('c'), g = cv.getContext('2d'), colour = '#e6f3ff', eraser = false, drawing = false, last = null, undo = [], t = null;
var COLS = ['#e6f3ff', '#7dd3fc', '#86efac', '#fde68a', '#fca5a5', '#ff6fae', '#c4b5fd', '#0b1726'];
function el(id) { return document.getElementById(id); }
function bg() { g.fillStyle = '#0f2136'; g.fillRect(0, 0, cv.width, cv.height); }
COLS.forEach(function (c) { var b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.title = c; b.onclick = function () { colour = c; eraser = false; el('erase').classList.remove('on'); }; el('cols').appendChild(b); });
function pos(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; }
function keep() { clearTimeout(t); t = setTimeout(function () { save('sketch', cv.toDataURL('image/png')).then(function (r) { el('s').textContent = r.ok ? 'saved' : 'not saved: ' + (r.reason || 'storage is off'); }); }, 600); }
cv.onpointerdown = function (e) { cv.setPointerCapture(e.pointerId); drawing = true; last = pos(e); undo.push(g.getImageData(0, 0, cv.width, cv.height)); if (undo.length > 20) undo.shift(); };
cv.onpointermove = function (e) {
  if (!drawing) return; var p = pos(e);
  g.strokeStyle = eraser ? '#0f2136' : colour; g.lineWidth = el('size').value * (e.pressure && e.pointerType === 'pen' ? e.pressure * 2 : 1); g.lineCap = g.lineJoin = 'round';
  g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke(); last = p;
};
cv.onpointerup = cv.onpointercancel = function () { if (drawing) { drawing = false; keep(); } };
el('erase').onclick = function () { eraser = !eraser; el('erase').classList.toggle('on', eraser); };
el('undo').onclick = function () { var u = undo.pop(); if (u) { g.putImageData(u, 0, 0); keep(); } };
el('clear').onclick = function () { undo.push(g.getImageData(0, 0, cv.width, cv.height)); bg(); keep(); };
bg();
load('sketch').then(function (v) { if (typeof v === 'string' && v.indexOf('data:image/png') === 0) { var im = new Image(); im.onload = function () { g.drawImage(im, 0, 0); }; im.src = v; } });
parent.postMessage({ topic: 'plug.ready' }, '*');
</script>
