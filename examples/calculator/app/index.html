<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1726;color:#e6f3ff;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7dd3fc;margin:0 0 12px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(40,74,112,.55);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#7dd3fc}button.on,button.primary{background:#7dd3fc;color:#06121f;border-color:#7dd3fc}
input,select,textarea{background:rgba(8,20,36,.72);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:7px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#7dd3fc}
.card{background:rgba(22,44,72,.55);border:1px solid rgba(125,211,252,.22);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:#8fb3cf}.ok{color:#86efac}.bad{color:#fca5a5}
.note{margin-top:8px;font-size:12px;color:#8fb3cf}

#scr{font:600 34px ui-monospace,Consolas,monospace;text-align:right;padding:8px 4px;overflow-x:auto;white-space:nowrap}#hist{text-align:right;min-height:54px;font:12px ui-monospace,Consolas,monospace}
#keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#keys button{padding:14px 0;font-size:18px}</style>

<div class="wrap" style="max-width:380px"><h1>Calculator</h1><div class="card">
<div id="hist" class="mut"></div><div id="scr">0</div>
<div id="keys"></div></div><div class="note">Type on your keyboard too: numbers, + - * / ( ), Enter, Backspace, Esc.</div></div>
<script>
// A plug's only way out is the socket. Each request is checked against plug.json and logged.
function ask(msg) {
  return new Promise(function (resolve) {
    var id = Math.random().toString(36).slice(2);
    var timer = setTimeout(function () { removeEventListener('message', on); resolve({ ok: false, reason: 'no answer' }); }, 10000);
    function on(e) { if (e.data && e.data.topic === 'reply' && e.data.id === id) { clearTimeout(timer); removeEventListener('message', on); resolve(e.data); } }
    addEventListener('message', on);
    parent.postMessage(Object.assign({ id: id }, msg), '*');
  });
}
function load(key) { return ask({ topic: 'storage.get', key: key }).then(function (r) { return r.ok ? r.reply : undefined; }); }
function save(key, value) { return ask({ topic: 'storage.set', key: key, value: value }); }

var expr = '', hist = [];
var K = ['C', '(', ')', '/', '7', '8', '9', '*', '4', '5', '6', '-', '1', '2', '3', '+', '0', '.', 'DEL', '='];
function el(id) { return document.getElementById(id); }
function calc(s) {                      // a tiny parser: numbers, + - * / and brackets only, no eval
  var i = 0;
  function num() { var m = /^\d*\.?\d+/.exec(s.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); }
  function atom() { if (s[i] === '-') { i++; return -atom(); } if (s[i] === '(') { i++; var v = add(); if (s[i++] !== ')') throw 0; return v; } return num(); }
  function mul() { var v = atom(); while (s[i] === '*' || s[i] === '/') { var o = s[i++], w = atom(); v = o === '*' ? v * w : v / w; } return v; }
  function add() { var v = mul(); while (s[i] === '+' || s[i] === '-') { var o = s[i++], w = mul(); v = o === '+' ? v + w : v - w; } return v; }
  var r = add(); if (i !== s.length) throw 0; return r;
}
function show() { el('scr').textContent = expr || '0'; el('hist').innerHTML = ''; hist.slice(-3).forEach(function (h) { var d = document.createElement('div'); d.textContent = h; el('hist').appendChild(d); }); }
function press(k) {
  if (k === 'C') expr = '';
  else if (k === 'DEL') expr = expr.slice(0, -1);
  else if (k === '=') { try { var r = calc(expr); if (!isFinite(r)) throw 0; r = +r.toPrecision(12); hist.push(expr + ' = ' + r); expr = String(r); } catch (e) { el('scr').textContent = 'not a sum'; return; } }
  else if (expr.length < 80) expr += k;
  show();
}
K.forEach(function (k) { var b = document.createElement('button'); b.textContent = k; if (k === '=') b.className = 'primary'; b.onclick = function () { press(k); }; el('keys').appendChild(b); });
addEventListener('keydown', function (e) {
  if (/^[0-9.+*\/()-]$/.test(e.key)) press(e.key); else if (e.key === 'Enter') press('='); else if (e.key === 'Backspace') press('DEL'); else if (e.key === 'Escape') press('C'); else return;
  e.preventDefault();
});
show();
parent.postMessage({ topic: 'plug.ready' }, '*');
</script>
