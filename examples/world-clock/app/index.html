<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Clock</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1726;color:#e6f3ff;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7dd3fc;margin:0 0 12px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(40,74,112,.55);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#7dd3fc}button.on,button.primary{background:#7dd3fc;color:#06121f;border-color:#7dd3fc}
input,select,textarea{background:rgba(8,20,36,.72);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:7px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#7dd3fc}
.card{background:rgba(22,44,72,.55);border:1px solid rgba(125,211,252,.22);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:#8fb3cf}.ok{color:#86efac}.bad{color:#fca5a5}
.note{margin-top:8px;font-size:12px;color:#8fb3cf}

.clock{display:flex;align-items:center;gap:12px;margin-bottom:8px}.clock>div:first-child{flex:1}.t{font:600 26px ui-monospace,Consolas,monospace}</style>

<div class="wrap"><h1>World Clock</h1>
<div class="row"><select id="zone" style="flex:1"></select><button type="button" id="add" class="primary">add</button></div>
<div id="list" style="margin-top:12px"></div></div>
<script>
// A plug's only way out is the socket. Each request is checked against plug.json and logged.
function ask(msg) {
  return new Promise(function (resolve) {
    var id = Math.random().toString(36).slice(2);
    var timer = setTimeout(function () { removeEventListener('message', on); resolve({ ok: false, reason: 'no answer' }); }, 10000);
    function on(e) { if (e.data && e.data.topic === 'reply' && e.data.id === id) { clearTimeout(timer); removeEventListener('message', on); resolve(e.data); } }
    addEventListener('message', on);
    parent.postMessage(Object.assign({ id: id }, msg), '*');
  });
}
function load(key) { return ask({ topic: 'storage.get', key: key }).then(function (r) { return r.ok ? r.reply : undefined; }); }
function save(key, value) { return ask({ topic: 'storage.set', key: key, value: value }); }

var zones = [], ALL = [];
function el(id) { return document.getElementById(id); }
try { ALL = Intl.supportedValuesOf('timeZone'); } catch (e) { ALL = ['Europe/London', 'Europe/Paris', 'America/New_York', 'America/Los_Angeles', 'Asia/Tokyo', 'Asia/Dubai', 'Australia/Sydney', 'UTC']; }
ALL.forEach(function (z) { var o = document.createElement('option'); o.value = o.textContent = z; el('zone').appendChild(o); });
function draw() {
  var box = el('list'); box.textContent = '';
  zones.forEach(function (z, i) {
    var now = new Date(), r = document.createElement('div'); r.className = 'card clock';
    var t = new Intl.DateTimeFormat(undefined, { timeZone: z, hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(now);
    var d = new Intl.DateTimeFormat(undefined, { timeZone: z, weekday: 'short', day: 'numeric', month: 'short' }).format(now);
    r.innerHTML = '<div><b></b><div class="mut"></div></div><div class="t"></div><button title="remove">x</button>';
    r.children[0].children[0].textContent = z.split('/').pop().replace(/_/g, ' '); r.children[0].children[1].textContent = z + ' - ' + d; r.children[1].textContent = t;
    r.children[2].onclick = function () { zones.splice(i, 1); save('zones', zones); draw(); };
    box.appendChild(r);
  });
}
el('add').onclick = function () { var z = el('zone').value; if (zones.indexOf(z) < 0) { zones.push(z); save('zones', zones); draw(); } };
load('zones').then(function (v) { zones = Array.isArray(v) ? v.filter(function (z) { return ALL.indexOf(z) >= 0; }) : [Intl.DateTimeFormat().resolvedOptions().timeZone, 'America/New_York', 'Asia/Tokyo']; draw(); });
setInterval(function () { if (!document.hidden) draw(); }, 1000);
parent.postMessage({ topic: 'plug.ready' }, '*');
</script>
