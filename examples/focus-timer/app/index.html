<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Timer</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1726;color:#e6f3ff;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7dd3fc;margin:0 0 12px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(40,74,112,.55);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#7dd3fc}button.on,button.primary{background:#7dd3fc;color:#06121f;border-color:#7dd3fc}
input,select,textarea{background:rgba(8,20,36,.72);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:7px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#7dd3fc}
.card{background:rgba(22,44,72,.55);border:1px solid rgba(125,211,252,.22);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:#8fb3cf}.ok{color:#86efac}.bad{color:#fca5a5}
.note{margin-top:8px;font-size:12px;color:#8fb3cf}

#time{font:600 56px ui-monospace,Consolas,monospace;margin-top:-170px;height:120px;display:flex;align-items:center;justify-content:center}#mode{margin-top:-20px;margin-bottom:60px;letter-spacing:.2em;text-transform:uppercase}</style>

<div class="wrap" style="text-align:center"><h1>Focus Timer</h1>
<canvas id="c" width="260" height="260"></canvas><div id="time">25:00</div><div id="mode" class="mut">focus</div>
<div class="row" style="justify-content:center;margin-top:12px"><button id="go" class="primary">start</button><button id="reset">reset</button><select id="len"><option value="25,5">25 / 5</option><option value="50,10">50 / 10</option><option value="15,3">15 / 3</option></select></div>
<div class="note">Blocks finished today: <b id="done">0</b></div></div>
<script>
// A plug's only way out is the socket. Each request is checked against plug.json and logged.
function ask(msg) {
  return new Promise(function (resolve) {
    var id = Math.random().toString(36).slice(2);
    var timer = setTimeout(function () { removeEventListener('message', on); resolve({ ok: false, reason: 'no answer' }); }, 10000);
    function on(e) { if (e.data && e.data.topic === 'reply' && e.data.id === id) { clearTimeout(timer); removeEventListener('message', on); resolve(e.data); } }
    addEventListener('message', on);
    parent.postMessage(Object.assign({ id: id }, msg), '*');
  });
}
function load(key) { return ask({ topic: 'storage.get', key: key }).then(function (r) { return r.ok ? r.reply : undefined; }); }
function save(key, value) { return ask({ topic: 'storage.set', key: key, value: value }); }

var focus = 25, rest = 5, left = focus * 60, total = left, onBreak = false, run = null, done = 0, day = new Date().toDateString();
function el(id) { return document.getElementById(id); }
function chime() { try { var a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 660; g.gain.setValueAtTime(.2, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + 1.2); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 1.2); } catch (e) {} }
function draw() {
  var m = Math.floor(left / 60), s = left % 60; el('time').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  el('mode').textContent = onBreak ? 'break' : 'focus';
  var c = el('c').getContext('2d'); c.clearRect(0, 0, 260, 260); c.lineWidth = 12; c.lineCap = 'round';
  c.strokeStyle = 'rgba(125,211,252,.15)'; c.beginPath(); c.arc(130, 130, 110, 0, 7); c.stroke();
  c.strokeStyle = onBreak ? '#86efac' : '#7dd3fc'; c.beginPath(); c.arc(130, 130, 110, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * (1 - left / total)); c.stroke();
}
function tick() {
  if (left > 0) { left--; draw(); return; }
  chime();
  if (!onBreak) { done++; save('focus', { day: day, done: done }); el('done').textContent = done; }
  onBreak = !onBreak; left = total = (onBreak ? rest : focus) * 60; draw();
}
el('go').onclick = function () { if (run) { clearInterval(run); run = null; el('go').textContent = 'start'; } else { run = setInterval(tick, 1000); el('go').textContent = 'pause'; } };
el('reset').onclick = function () { clearInterval(run); run = null; el('go').textContent = 'start'; onBreak = false; left = total = focus * 60; draw(); };
el('len').onchange = function () { var v = el('len').value.split(','); focus = +v[0]; rest = +v[1]; el('reset').onclick(); };
load('focus').then(function (v) { if (v && v.day === day) { done = v.done | 0; el('done').textContent = done; } });
draw();
parent.postMessage({ topic: 'plug.ready' }, '*');
</script>
