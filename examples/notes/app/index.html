<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1726;color:#e6f3ff;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7dd3fc;margin:0 0 12px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(40,74,112,.55);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#7dd3fc}button.on,button.primary{background:#7dd3fc;color:#06121f;border-color:#7dd3fc}
input,select,textarea{background:rgba(8,20,36,.72);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:7px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#7dd3fc}
.card{background:rgba(22,44,72,.55);border:1px solid rgba(125,211,252,.22);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:#8fb3cf}.ok{color:#86efac}.bad{color:#fca5a5}
.note{margin-top:8px;font-size:12px;color:#8fb3cf}

.grid{display:grid;grid-template-columns:220px 1fr;gap:12px;min-height:70vh}.side{display:flex;flex-direction:column;gap:8px}
.item{padding:7px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item:hover,.item.on{background:rgba(125,211,252,.14)}
.ed{display:flex;flex-direction:column;gap:8px}#body{flex:1;min-height:50vh;resize:none}
@media (max-width:600px){.grid{grid-template-columns:1fr}}</style>

<div class="wrap"><h1>Notes</h1>
<div class="grid"><div class="side card"><div class="row"><input id="q" placeholder="search" style="flex:1"><button id="add" class="primary">+ new</button></div><div id="list"></div></div>
<div class="card ed"><input id="title" placeholder="Title"><textarea id="body" placeholder="Write anything..."></textarea><div class="row"><span id="saved" class="mut"></span><span style="flex:1"></span><button id="pin">pin</button><button id="del">delete</button></div></div></div></div>
<script>
// A plug's only way out is the socket. Each request is checked against plug.json and logged.
function ask(msg) {
  return new Promise(function (resolve) {
    var id = Math.random().toString(36).slice(2);
    var timer = setTimeout(function () { removeEventListener('message', on); resolve({ ok: false, reason: 'no answer' }); }, 10000);
    function on(e) { if (e.data && e.data.topic === 'reply' && e.data.id === id) { clearTimeout(timer); removeEventListener('message', on); resolve(e.data); } }
    addEventListener('message', on);
    parent.postMessage(Object.assign({ id: id }, msg), '*');
  });
}
function load(key) { return ask({ topic: 'storage.get', key: key }).then(function (r) { return r.ok ? r.reply : undefined; }); }
function save(key, value) { return ask({ topic: 'storage.set', key: key, value: value }); }

var notes = [], cur = null, t = null;
function el(id) { return document.getElementById(id); }
function draw() {
  var q = el('q').value.toLowerCase(), box = el('list'); box.textContent = '';
  notes.slice().sort(function (a, b) { return (b.pin - a.pin) || (b.at - a.at); }).forEach(function (n) {
    if (q && (n.title + ' ' + n.body).toLowerCase().indexOf(q) < 0) return;
    var d = document.createElement('div'); d.className = 'item' + (n === cur ? ' on' : '');
    d.textContent = (n.pin ? '* ' : '') + (n.title || 'Untitled'); d.onclick = function () { open(n); }; box.appendChild(d);
  });
}
function open(n) { cur = n; el('title').value = n.title; el('body').value = n.body; el('pin').textContent = n.pin ? 'unpin' : 'pin'; draw(); }
function store() { clearTimeout(t); el('saved').textContent = 'saving...'; t = setTimeout(function () { save('notes', notes).then(function (r) { el('saved').textContent = r.ok ? 'saved on this device' : 'not saved: ' + (r.reason || 'storage is off'); }); }, 400); }
el('add').onclick = function () { var n = { title: '', body: '', pin: 0, at: Date.now() }; notes.push(n); open(n); el('title').focus(); store(); };
['title', 'body'].forEach(function (k) { el(k).oninput = function () { if (!cur) el('add').onclick(); cur[k] = el(k).value; cur.at = Date.now(); draw(); store(); }; });
el('pin').onclick = function () { if (cur) { cur.pin = cur.pin ? 0 : 1; open(cur); store(); } };
el('del').onclick = function () { if (cur) { notes.splice(notes.indexOf(cur), 1); cur = null; el('title').value = el('body').value = ''; draw(); store(); } };
el('q').oninput = draw;
load('notes').then(function (v) { notes = Array.isArray(v) ? v : []; if (notes.length) open(notes[0]); else draw(); });
parent.postMessage({ topic: 'plug.ready' }, '*');
</script>
