<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1726;color:#e6f3ff;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7dd3fc;margin:0 0 12px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(40,74,112,.55);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#7dd3fc}button.on,button.primary{background:#7dd3fc;color:#06121f;border-color:#7dd3fc}
input,select,textarea{background:rgba(8,20,36,.72);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:7px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#7dd3fc}
.card{background:rgba(22,44,72,.55);border:1px solid rgba(125,211,252,.22);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:#8fb3cf}.ok{color:#86efac}.bad{color:#fca5a5}
.note{margin-top:8px;font-size:12px;color:#8fb3cf}

canvas{width:100%;margin-top:10px;border-radius:12px;border:1px solid rgba(125,211,252,.28);display:block;touch-action:none}</style>

<div class="wrap" style="text-align:center;max-width:520px"><h1>Snake</h1>
<div class="row" style="justify-content:space-between"><span>score <b id="sc">0</b></span><span>best <b id="best">0</b></span><button id="go" class="primary">play</button></div>
<canvas id="c" width="480" height="480"></canvas><div class="note">Arrow keys or WASD to steer, space to pause, swipe on a phone.</div></div>
<script>
// A plug's only way out is the socket. Each request is checked against plug.json and logged.
function ask(msg) {
  return new Promise(function (resolve) {
    var id = Math.random().toString(36).slice(2);
    var timer = setTimeout(function () { removeEventListener('message', on); resolve({ ok: false, reason: 'no answer' }); }, 10000);
    function on(e) { if (e.data && e.data.topic === 'reply' && e.data.id === id) { clearTimeout(timer); removeEventListener('message', on); resolve(e.data); } }
    addEventListener('message', on);
    parent.postMessage(Object.assign({ id: id }, msg), '*');
  });
}
function load(key) { return ask({ topic: 'storage.get', key: key }).then(function (r) { return r.ok ? r.reply : undefined; }); }
function save(key, value) { return ask({ topic: 'storage.set', key: key, value: value }); }

var N = 24, cv = document.getElementById('c'), g = cv.getContext('2d'), S = cv.width / N;
var snake, dir, next, food, score, best = 0, loop = null, paused = false;
function el(id) { return document.getElementById(id); }
function place() { do { food = [Math.floor(Math.random() * N), Math.floor(Math.random() * N)]; } while (snake.some(function (p) { return p[0] === food[0] && p[1] === food[1]; })); }
function start() { snake = [[12, 12], [11, 12], [10, 12]]; dir = next = [1, 0]; score = 0; el('sc').textContent = 0; place(); clearInterval(loop); paused = false; loop = setInterval(step, 110); el('go').textContent = 'restart'; }
function draw() {
  g.fillStyle = '#0f2136'; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#ff6fae'; g.beginPath(); g.arc(food[0] * S + S / 2, food[1] * S + S / 2, S / 2.6, 0, 7); g.fill();
  snake.forEach(function (p, i) { g.fillStyle = i ? '#7dd3fc' : '#e6f3ff'; g.fillRect(p[0] * S + 1, p[1] * S + 1, S - 2, S - 2); });
}
function over() { clearInterval(loop); loop = null; g.fillStyle = 'rgba(11,23,38,.75)'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#e6f3ff'; g.font = '600 28px system-ui'; g.textAlign = 'center'; g.fillText('game over', cv.width / 2, cv.height / 2); el('go').textContent = 'play again'; }
function step() {
  if (paused) return; dir = next;
  var h = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
  if (h[0] < 0 || h[1] < 0 || h[0] >= N || h[1] >= N || snake.some(function (p) { return p[0] === h[0] && p[1] === h[1]; })) return over();
  snake.unshift(h);
  if (h[0] === food[0] && h[1] === food[1]) { score++; el('sc').textContent = score; if (score > best) { best = score; el('best').textContent = best; save('best', best); } place(); } else snake.pop();
  draw();
}
function turn(d) { if (d[0] !== -dir[0] || d[1] !== -dir[1]) next = d; }
var KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
addEventListener('keydown', function (e) { if (KEYS[e.key]) { turn(KEYS[e.key]); e.preventDefault(); } else if (e.key === ' ') { paused = !paused; e.preventDefault(); } });
var t0 = null; cv.ontouchstart = function (e) { t0 = e.touches[0]; }; cv.ontouchend = function (e) { if (!t0) return; var t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY; if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) turn(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]); t0 = null; };
el('go').onclick = start;
document.addEventListener('visibilitychange', function () { if (document.hidden) paused = true; });
snake = [[12, 12], [11, 12], [10, 12]]; food = [16, 12]; draw();
load('best').then(function (v) { best = v | 0; el('best').textContent = best; });
parent.postMessage({ topic: 'plug.ready' }, '*');
</script>
