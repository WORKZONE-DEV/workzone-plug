<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Writer</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1726;color:#e6f3ff;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7dd3fc;margin:0 0 12px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(40,74,112,.55);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#7dd3fc}button.on,button.primary{background:#7dd3fc;color:#06121f;border-color:#7dd3fc}
input,select,textarea{background:rgba(8,20,36,.72);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:7px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#7dd3fc}
.card{background:rgba(22,44,72,.55);border:1px solid rgba(125,211,252,.22);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:#8fb3cf}.ok{color:#86efac}.bad{color:#fca5a5}
.note{margin-top:8px;font-size:12px;color:#8fb3cf}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:76vh}#src{resize:none;height:100%;font:13px/1.5 ui-monospace,Consolas,monospace}
#out{overflow:auto}#out code,#out pre{background:rgba(8,20,36,.8);border-radius:6px;padding:1px 5px;font:12px ui-monospace,Consolas,monospace}#out pre{padding:10px;white-space:pre-wrap}
#out blockquote{border-left:3px solid #7dd3fc;margin:6px 0;padding-left:10px;color:#8fb3cf}#out a{color:#7dd3fc}
@media (max-width:700px){.grid{grid-template-columns:1fr;height:auto}#src{height:40vh}}</style>

<div class="wrap" style="max-width:1100px"><h1>Markdown Writer</h1>
<div class="grid"><textarea id="src" placeholder="# Title&#10;&#10;Write **bold**, *italic*, lists, links and code."></textarea><div id="out" class="card"></div></div>
<div class="note" id="s">Headings (#), **bold**, *italic*, `code`, lists (- or 1.), > quotes, [links](https://example.com), code blocks (```).</div></div>
<script>
// A plug's only way out is the socket. Each request is checked against plug.json and logged.
function ask(msg) {
  return new Promise(function (resolve) {
    var id = Math.random().toString(36).slice(2);
    var timer = setTimeout(function () { removeEventListener('message', on); resolve({ ok: false, reason: 'no answer' }); }, 10000);
    function on(e) { if (e.data && e.data.topic === 'reply' && e.data.id === id) { clearTimeout(timer); removeEventListener('message', on); resolve(e.data); } }
    addEventListener('message', on);
    parent.postMessage(Object.assign({ id: id }, msg), '*');
  });
}
function load(key) { return ask({ topic: 'storage.get', key: key }).then(function (r) { return r.ok ? r.reply : undefined; }); }
function save(key, value) { return ask({ topic: 'storage.set', key: key, value: value }); }

function el(id) { return document.getElementById(id); }
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" title="links open outside the plug are blocked">$1</a>');
}
function md(text) {
  var out = [], lines = text.split(/\r?\n/), list = null, code = false;
  function close() { if (list) { out.push('</' + list + '>'); list = null; } }
  lines.forEach(function (l) {
    if (/^```/.test(l)) { close(); out.push(code ? '</pre>' : '<pre>'); code = !code; return; }
    if (code) { out.push(esc(l)); return; }
    var h = /^(#{1,4})\s+(.*)/.exec(l), ul = /^\s*[-*]\s+(.*)/.exec(l), ol = /^\s*\d+\.\s+(.*)/.exec(l);
    if (h) { close(); out.push('<h' + (h[1].length + 1) + '>' + inline(h[2]) + '</h' + (h[1].length + 1) + '>'); }
    else if (ul || ol) { var t = ul ? 'ul' : 'ol'; if (list !== t) { close(); out.push('<' + t + '>'); list = t; } out.push('<li>' + inline((ul || ol)[1]) + '</li>'); }
    else if (/^>\s?/.test(l)) { close(); out.push('<blockquote>' + inline(l.replace(/^>\s?/, '')) + '</blockquote>'); }
    else if (!l.trim()) close();
    else { close(); out.push('<p>' + inline(l) + '</p>'); }
  });
  close(); if (code) out.push('</pre>');
  return out.join('\n');
}
var t = null;
function render() { el('out').innerHTML = md(el('src').value); }
el('src').oninput = function () { render(); clearTimeout(t); t = setTimeout(function () { save('doc', el('src').value); }, 500); };
el('out').onclick = function (e) { if (e.target.tagName === 'A') e.preventDefault(); };
load('doc').then(function (v) { el('src').value = typeof v === 'string' ? v : '# Hello\n\nStart writing. It saves on this device as you type.'; render(); });
parent.postMessage({ topic: 'plug.ready' }, '*');
</script>
