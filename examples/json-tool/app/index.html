<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Tool</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1726;color:#e6f3ff;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7dd3fc;margin:0 0 12px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(40,74,112,.55);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#7dd3fc}button.on,button.primary{background:#7dd3fc;color:#06121f;border-color:#7dd3fc}
input,select,textarea{background:rgba(8,20,36,.72);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:7px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#7dd3fc}
.card{background:rgba(22,44,72,.55);border:1px solid rgba(125,211,252,.22);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:#8fb3cf}.ok{color:#86efac}.bad{color:#fca5a5}
.note{margin-top:8px;font-size:12px;color:#8fb3cf}

#src{width:100%;height:78vh;resize:none;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre;tab-size:2}</style>

<div class="wrap" style="max-width:1100px"><h1>JSON Tool</h1>
<div class="row" style="margin-bottom:8px"><button id="fmt" class="primary">tidy</button><button id="min">shrink</button><button id="sort">sort keys</button><span id="st" class="mut"></span></div>
<textarea id="src" spellcheck="false" placeholder='Paste JSON here, e.g. {"name": "plug", "powers": []}'></textarea></div>
<script>
// A plug's only way out is the socket. Each request is checked against plug.json and logged.
function ask(msg) {
  return new Promise(function (resolve) {
    var id = Math.random().toString(36).slice(2);
    var timer = setTimeout(function () { removeEventListener('message', on); resolve({ ok: false, reason: 'no answer' }); }, 10000);
    function on(e) { if (e.data && e.data.topic === 'reply' && e.data.id === id) { clearTimeout(timer); removeEventListener('message', on); resolve(e.data); } }
    addEventListener('message', on);
    parent.postMessage(Object.assign({ id: id }, msg), '*');
  });
}
function load(key) { return ask({ topic: 'storage.get', key: key }).then(function (r) { return r.ok ? r.reply : undefined; }); }
function save(key, value) { return ask({ topic: 'storage.set', key: key, value: value }); }

function el(id) { return document.getElementById(id); }
function parse() {
  var s = el('src').value;
  try { var v = JSON.parse(s); el('st').className = 'ok'; el('st').textContent = 'valid JSON (' + s.length + ' characters)'; return { ok: true, v: v }; }
  catch (e) {
    var m = /position (\d+)/.exec(e.message), pos = m ? +m[1] : -1, line = pos >= 0 ? s.slice(0, pos).split('\n').length : 0;
    el('st').className = 'bad'; el('st').textContent = 'not valid: ' + e.message + (line ? ' (line ' + line + ')' : '');
    if (pos >= 0) { el('src').focus(); el('src').setSelectionRange(pos, pos + 1); }
    return { ok: false };
  }
}
function sorted(v) { if (Array.isArray(v)) return v.map(sorted); if (v && typeof v === 'object') { var o = {}; Object.keys(v).sort().forEach(function (k) { o[k] = sorted(v[k]); }); return o; } return v; }
el('fmt').onclick = function () { var r = parse(); if (r.ok) el('src').value = JSON.stringify(r.v, null, 2); };
el('min').onclick = function () { var r = parse(); if (r.ok) el('src').value = JSON.stringify(r.v); };
el('sort').onclick = function () { var r = parse(); if (r.ok) el('src').value = JSON.stringify(sorted(r.v), null, 2); };
var t = null; el('src').oninput = function () { clearTimeout(t); t = setTimeout(function () { if (el('src').value.trim()) parse(); else el('st').textContent = ''; }, 400); };
parent.postMessage({ topic: 'plug.ready' }, '*');
</script>
