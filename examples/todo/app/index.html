<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1726;color:#e6f3ff;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7dd3fc;margin:0 0 12px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{background:rgba(40,74,112,.55);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#7dd3fc}button.on,button.primary{background:#7dd3fc;color:#06121f;border-color:#7dd3fc}
input,select,textarea{background:rgba(8,20,36,.72);border:1px solid rgba(125,211,252,.28);border-radius:8px;padding:7px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#7dd3fc}
.card{background:rgba(22,44,72,.55);border:1px solid rgba(125,211,252,.22);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:#8fb3cf}.ok{color:#86efac}.bad{color:#fca5a5}
.note{margin-top:8px;font-size:12px;color:#8fb3cf}

.it{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid rgba(125,211,252,.12)}.it span{flex:1}.it.done span{text-decoration:line-through;color:#8fb3cf}
.it button{padding:2px 8px}</style>

<div class="wrap"><h1>To-Do</h1><div class="card">
<div class="row"><input id="t" placeholder="What needs doing?" style="flex:1" maxlength="200"><button type="button" id="add" class="primary">add</button></div>
<div class="row" style="margin:10px 0"><button data-f="all" class="on">all</button><button data-f="open">to do</button><button data-f="done">done</button><span style="flex:1"></span><span id="n" class="mut"></span><button id="clear">clear done</button></div>
<div id="list"></div></div><div class="note" id="s"></div></div>
<script>
// A plug's only way out is the socket. Each request is checked against plug.json and logged.
function ask(msg) {
  return new Promise(function (resolve) {
    var id = Math.random().toString(36).slice(2);
    var timer = setTimeout(function () { removeEventListener('message', on); resolve({ ok: false, reason: 'no answer' }); }, 10000);
    function on(e) { if (e.data && e.data.topic === 'reply' && e.data.id === id) { clearTimeout(timer); removeEventListener('message', on); resolve(e.data); } }
    addEventListener('message', on);
    parent.postMessage(Object.assign({ id: id }, msg), '*');
  });
}
function load(key) { return ask({ topic: 'storage.get', key: key }).then(function (r) { return r.ok ? r.reply : undefined; }); }
function save(key, value) { return ask({ topic: 'storage.set', key: key, value: value }); }

var items = [], filter = 'all';
function el(id) { return document.getElementById(id); }
function store() { save('todo', items).then(function (r) { el('s').textContent = r.ok ? '' : 'Not saved: ' + (r.reason || 'storage is off'); }); }
function draw() {
  var box = el('list'); box.textContent = '';
  items.forEach(function (it, i) {
    if (filter === 'open' && it.done || filter === 'done' && !it.done) return;
    var r = document.createElement('label'); r.className = 'it' + (it.done ? ' done' : '');
    var c = document.createElement('input'); c.type = 'checkbox'; c.checked = it.done; c.onchange = function () { it.done = c.checked; draw(); store(); };
    var s = document.createElement('span'); s.textContent = it.text;
    var x = document.createElement('button'); x.textContent = 'x'; x.title = 'remove'; x.onclick = function (e) { e.preventDefault(); items.splice(i, 1); draw(); store(); };
    r.appendChild(c); r.appendChild(s); r.appendChild(x); box.appendChild(r);
  });
  var left = items.filter(function (i) { return !i.done; }).length; el('n').textContent = left + ' to do';
}
// (forms are blocked inside a plug's box, so a button and the Enter key do the job)
function add() { var v = el('t').value.trim(); if (!v) return; items.unshift({ text: v, done: false }); el('t').value = ''; draw(); store(); }
el('add').onclick = add;
el('t').onkeydown = function (e) { if (e.key === 'Enter') add(); };
[].forEach.call(document.querySelectorAll('[data-f]'), function (b) { b.onclick = function () { filter = b.dataset.f; [].forEach.call(document.querySelectorAll('[data-f]'), function (x) { x.classList.toggle('on', x === b); }); draw(); }; });
el('clear').onclick = function () { items = items.filter(function (i) { return !i.done; }); draw(); store(); };
load('todo').then(function (v) { items = Array.isArray(v) ? v : []; draw(); });
parent.postMessage({ topic: 'plug.ready' }, '*');
</script>
